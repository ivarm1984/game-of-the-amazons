plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.amazons'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('startFrontend') {
	group = 'application'
	description = 'Starts the Vite frontend dev server in the background'
	doLast {
		def npmCommand = org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'npm.cmd' : 'npm'
		def process = new ProcessBuilder(npmCommand, 'run', 'dev')
				.directory(file('../frontend'))
				.inheritIO()
				.start()
		println "Frontend dev server started (PID: ${process.pid()})"
	}
}

tasks.named('bootRun') {
	mustRunAfter 'startFrontend'
}

tasks.register('dev') {
	group = 'application'
	description = 'Starts the frontend dev server and the Spring Boot backend together'
	dependsOn 'startFrontend', 'bootRun'
}
